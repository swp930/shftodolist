<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <!-- Header content -->
    </header>

    <main>
      <h1>Admin functions</h1>
      <br />
      <button onclick="onClickSanityCheck1()">Sanity Check 1</button>
      <br />
      <button onclick="getEmptyColumns()">Get Empty Columns</button>
      <br />
      <button onclick="add20ColumnsSheet1()">Add 20 columns to sheet1</button>
      <br />
      <h1>ShadowFox</h1>
      <br />
      <button onclick="loadRefreshTodoListItems()">
        1. Load / Refresh Todo List Items
      </button>
      <br />
      <input type="text" id="one_time_todo_item_add_text" />
      <br />
      <button onclick="onClickHandlerAddNewTodoItem()">
        Add One Time Todo Item
      </button>
      <br />
      <select name="todo_list_items" id="todo_list_items"></select>
      <br />
      <button onclick="logCurrentSelectValue()">
        Log current select value
      </button>
      <br />
      <button onclick="loadAtomicTasksForCurrentTask()">
        2. Load atomic tasks for current task
      </button>
      <ul id="atomic_tasks"></ul>
      <br />
      <input type="text" placeholder="Add atomic task" id="add_atomic_task" />
      <br />
      <button onclick="onClickHandlerAddAtomicTasks()">
        3. Add atomic task to current task
      </button>
      <br />
      <button onclick="onClickMarkTaskAsCompleted()">
        Mark task as completed
      </button>
      <div id="toast-container" aria-live="polite"></div>
    </main>

    <footer>
      <!-- Footer content -->
    </footer>

    <script src="script.js"></script>
  </body>
</html>
