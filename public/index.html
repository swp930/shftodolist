<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <!-- Header content -->
    </header>

    <main>
      <h1>ShadowFox</h1>
      <button onclick="asyncMutateSheetWrapper()">Mutate spreadsheet</button>
      <br />
      <button onclick="asyncGetDataForRow()">asyncGetDataForRow</button>
      <br />
      <button onclick="asyncGetDataForColumn()">asyncGetDataForColumn</button>
      <br />
      <button onclick="asyncAddToEndOfRow()">asyncAddToEndOfRow</button>
      <br />
      <button onclick="asyncAddToEndOfColumn()">asyncAddToEndOfColumn</button>
      <br />
      <button onclick="addToDoListTask()">Add todo list item</button>
      <br />
      <button onclick="getTodoListItems()">Get todo list items</button>
      <br />
      <button onclick="getAtomicItemsForTodoListTask()">
        Get atomic items for todo list task
      </button>
      <br />
      <button onclick="markTodoListAsCompleted()">
        Mark todo list as completed
      </button>
      <br />
      <button onclick="addTasksToRightmostColumn()">
        Add column to sheet2
      </button>
      <br />
      <button onclick="loadRefreshTodoListItems()">
        1. Load / Refresh Todo List Items
      </button>
      <br />
      <select name="todo_list_items" id="todo_list_items"></select>
      <br />
      <button onclick="logCurrentSelectValue()">
        Log current select value
      </button>
      <br />
      <button onclick="loadAtomicTasksForCurrentTask()">
        2. Load atomic tasks for current task
      </button>
      <ul id="atomic_tasks"></ul>
      <br />
      <input type="text" placeholder="Add atomic task" id="add_atomic_task" />
      <br />
      <button onclick="onClickHandlerAddAtomicTasks()">
        3. Add atomic task to current task
      </button>
    </main>

    <footer>
      <!-- Footer content -->
    </footer>

    <script src="script.js"></script>
  </body>
</html>
